<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --line:#EADFCF; --ink:#3B1D0C; --mute:#6E4E38;
  --brand:#63300F; --onbrand:#FBF6EE; --amber:#D4881A; --onamber:#3B1D0C;
  --nav:#3B1D0C; --navink:#FBF6EE; --hero:#3B1D0C; --heroink:#FBF6EE; --herotrack:rgba(251,246,238,.2);
  --ok:#2E7D4F; --warn:#F2C200; --bad:#C93B3B;
  --okbg:#E3F1E8; --warnbg:#FFF4C2; --badbg:#F8DFDF; --okink:#1F5C39; --warnink:#5C4700; --badink:#8E2323;
  --field:#FFFFFF; --seg:#F1E7D6; --shade:rgba(20,10,4,.55);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E120A; --card:#2A1A10; --line:#42291A; --ink:#F5EBDD; --mute:#C9B49C;
    --brand:#7A3E14; --nav:#150C06; --hero:#3B1D0C;
    --okbg:#1E3A2A; --warnbg:#4A3F0B; --badbg:#4A1E1E; --okink:#8FD3A9; --warnink:#F5D95C; --badink:#F2A0A0;
    --field:#1E120A; --seg:#1E120A; --shade:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E120A; --card:#2A1A10; --line:#42291A; --ink:#F5EBDD; --mute:#C9B49C;
  --brand:#7A3E14; --nav:#150C06; --hero:#3B1D0C;
  --okbg:#1E3A2A; --warnbg:#4A3F0B; --badbg:#4A1E1E; --okink:#8FD3A9; --warnink:#F5D95C; --badink:#F2A0A0;
  --field:#1E120A; --seg:#1E120A; --shade:rgba(0,0,0,.65); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:520px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand img{width:36px;height:36px;border-radius:10px;display:block}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:6px 16px 190px}
body.guide main{padding-bottom:40px}
.pt{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:14px 0 12px}
.mute{color:var(--mute)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.card .sub{color:var(--mute);font-size:14px;margin-bottom:10px}
.hero{background:var(--hero);color:var(--heroink);border-radius:28px;padding:22px 20px 20px;margin:12px 0}
.hero .l1{font-size:16px;opacity:.9}
.hero .big{font-size:62px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:2px 0 12px}
.hero .l2{font-size:14px;opacity:.85;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 13px 6px 9px;font-weight:700;font-size:14px}
.chip.ok{background:var(--okbg);color:var(--okink)}
.chip.warn{background:var(--warnbg);color:var(--warnink)}
.chip.bad{background:var(--badbg);color:var(--badink)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:99px}
.hero .bar{background:var(--herotrack)}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.35}
.alert svg{flex:none;margin-top:1px}
.alert.bad{background:var(--badbg);color:var(--badink)}
.alert.warn{background:var(--warnbg);color:var(--warnink)}
.alert.info{background:var(--seg);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row.first{border-top:0}
.row .g{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mute)}
.row .a{font-weight:700;white-space:nowrap}
.badge{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;display:inline-block}
.badge.ok{background:var(--okbg);color:var(--okink)}.badge.warn{background:var(--warnbg);color:var(--warnink)}.badge.bad{background:var(--badbg);color:var(--badink)}.badge.n{background:var(--seg);color:var(--mute)}
.btn{min-height:48px;border-radius:14px;border:0;font-weight:700;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--amber);color:var(--onamber)}
.btn.sec{background:var(--brand);color:var(--onbrand)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1;min-width:130px}
a.lnk,button.lnk{background:none;border:0;color:var(--brand);font-weight:700;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:root[data-theme="dark"] a.lnk,:root[data-theme="dark"] button.lnk{color:var(--amber)}
.in{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);padding:0 14px;font-size:16px}
textarea.in{padding:12px 14px;min-height:96px}
.lb{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--mute)}
.money .in{padding-left:42px}
.amt{min-height:68px;font-size:34px;font-weight:800;letter-spacing:-.02em}
.seg{display:flex;background:var(--seg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4;cursor:default}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{min-height:78px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;cursor:pointer;padding:6px 4px}
.cat .e{font-size:26px;line-height:1}
.cat.on{box-shadow:inset 0 0 0 2.5px var(--amber);border-color:var(--amber)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);color:var(--navink);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;color:inherit;opacity:.72;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;font-size:11.5px;font-weight:600;cursor:pointer}
.nav button.on{opacity:1;color:var(--amber)}
.fab{position:fixed;z-index:25;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:0 16px;pointer-events:none}
.fab .btn{pointer-events:auto;display:flex;max-width:488px;margin:0 auto;min-height:56px;font-size:17px;box-shadow:0 6px 18px rgba(59,29,12,.35)}
body.guide .nav,body.guide .fab,body.guide .top .hide-g{display:none}
.sheetback{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet{position:relative}
.sheetx{position:absolute;top:12px;right:12px;width:40px;height:40px}
.sheet h2{padding-right:46px;font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.sheet h3{font-size:16px;margin:16px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:60;max-width:90%;font-weight:600;font-size:15px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
.verdict{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;margin:14px 0 8px}
.verdict.ok{background:var(--okbg);color:var(--okink)}.verdict.warn{background:var(--warnbg);color:var(--warnink)}.verdict.bad{background:var(--badbg);color:var(--badink)}
.verdict .dot{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.verdict.ok .dot{background:var(--ok)}.verdict.warn .dot{background:var(--warn);color:#3B1D0C}.verdict.bad .dot{background:var(--bad)}
.verdict .vt{font-size:24px;font-weight:800;letter-spacing:-.01em}
.dots{display:flex;gap:6px;margin:6px 0 4px}.dots i{height:6px;flex:1;border-radius:9px;background:var(--line)}.dots i.on{background:var(--amber)}
.wk{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:12px;color:var(--mute)}
.wk i{display:block;width:100%;background:var(--amber);border-radius:8px 8px 3px 3px;min-height:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kv b{font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.empty{text-align:center;padding:22px 8px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.now{outline:2px solid var(--amber);outline-offset:-2px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.hero .big{font-size:52px}}
</style>
</head>

<script>
(function(){
'use strict';
/* ================= utilidades ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var mkey=function(d){return ymd(d).slice(0,7)};
var daysIn=function(y,m){return new Date(y,m+1,0).getDate()};
var parseYmd=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var fmtDM=function(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
var WD=['dom','lun','mar','mié','jue','vie','sáb'];
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var dayDiff=function(a,b){return Math.round((b-a)/86400000)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var sum=function(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)};
var nf=new Intl.NumberFormat('es-PE',{maximumFractionDigits:2});
var money=function(n){n=Math.round((n||0)*100)/100;return (n<0?'−':'')+'S/ '+nf.format(Math.abs(n))};
var num=function(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  v=String(v==null?'':v).trim().replace(/\s/g,'');
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(v))v=v.replace(/,/g,'');
  else if(v.indexOf(',')>-1&&v.indexOf('.')===-1)v=v.replace(',','.');
  else v=v.replace(/,/g,'');
  var n=parseFloat(v);return isFinite(n)?n:0;
};
var svg=function(d,s,sw){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'};
var P={
  hoy:'<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3v3M12 3v3"/>',
  reg:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/>',
  deu:'<path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7z"/><path d="M3 7l12-3v3"/><path d="M17 13.5h.01"/>',
  res:'<path d="M6 20v-9M12 20V5M18 20v-7"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  q:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  warn:'<path d="M12 4l9 16H3L12 4z"/><path d="M12 10v4M12 17h.01"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
var ico=function(k,s,sw){return svg(P[k],s,sw)};

/* ================= datos ================= */
var CATS=[
 {id:'desayuno',n:'Desayuno',e:'🍳',g:'food'},{id:'almuerzo',n:'Almuerzo',e:'🍲',g:'food'},{id:'cena',n:'Cena',e:'🌙',g:'food'},
 {id:'super',n:'Súper',e:'🛒',g:'food'},{id:'delivery',n:'Delivery',e:'🛵',g:'food'},{id:'cafe',n:'Café y snack',e:'☕',g:'food'},
 {id:'transporte',n:'Transporte',e:'🚌',g:'daily'},{id:'aseo',n:'Aseo',e:'🧼',g:'daily'},{id:'otros',n:'Otros',e:'➕',g:'daily'},
 {id:'mascota',n:'Mascota',e:'🐾',g:'fund'},{id:'salud',n:'Salud',e:'💊',g:'fund'},
 {id:'entrete',n:'Ocio y cine',e:'🎬',g:'fun'},{id:'gustos',n:'Gustos',e:'🛍️',g:'fun'},{id:'viaje',n:'Paseo o viaje',e:'🧳',g:'fun'}
];
var catOf=function(id){return CATS.filter(function(c){return c.id===id})[0]||CATS[8]};
var PAYL={sodexo:'Sodexo',efectivo:'Efectivo',tarjeta:'Tarjeta'};
var KEY='cafecuentas:v1';
var STORE_OK=true,MEM=null;
var DEF=function(){return {v:1,onboarded:false,salary:{amount:0,day:30},sodexo:{monthly:0,day:1,start:0},comm:{typical:0,split:{save:50,debt:30}},goal:0,fund:0,funCap:0,floor:0,fixed:[],debts:[],expenses:[],recharges:[],commissions:[],deposits:[],payments:[],outings:[],funBonus:{},theme:'light',lastPay:'efectivo',startDate:''}};
function norm(o){
  var d=DEF();
  Object.keys(d).forEach(function(k){
    if(o[k]===undefined)o[k]=d[k];
    else if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))o[k]=Object.assign({},d[k],o[k]);
  });
  o.comm.split=Object.assign({save:50,debt:30},o.comm.split||{});
  return o;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return norm(JSON.parse(r));}catch(e){STORE_OK=false}
  return MEM?norm(MEM):DEF();
}
var S=load();
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){STORE_OK=false;MEM=JSON.parse(JSON.stringify(S));}
}
function setPath(o,path,val){var p=path.split('.');for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function sodRest(){return sum(S.recharges,function(r){return r.amount})-sum(S.expenses.filter(function(e){return e.pay==='sodexo'}),function(e){return e.amount})}
function setSodBal(v){S.sodexo.start=v-sodRest()}

/* ================= cálculos ================= */
var bucket=function(e){return e.outing?'fun':catOf(e.cat).g};
function poolSpentOf(list,funBudget,fund){
  var daily=0,fundS=0,funS=0;
  list.forEach(function(e){
    if(e.pay==='sodexo')return;
    var b=bucket(e);
    if(b==='fund')fundS+=e.amount;else if(b==='fun')funS+=e.amount;else daily+=e.amount;
  });
  return {daily:daily,fundS:fundS,funS:funS,total:daily+Math.max(0,fundS-fund)+Math.max(0,funS-funBudget)};
}
function calc(now){
  now=now||new Date();
  var y=now.getFullYear(),m=now.getMonth(),d=now.getDate(),N=daysIn(y,m),D=N-d+1,mk=mkey(now),td=ymd(now);
  var salary=S.salary.amount||0;
  var pay=function(kind,id){return S.payments.filter(function(p){return p.kind===kind&&p.ref===id&&p.month===mk})[0]};
  var fixedTot=sum(S.fixed,function(f){var p=pay('fixed',f.id);return p?p.amount:f.amount});
  var debtTot=sum(S.debts,function(x){var p=pay('debt',x.id);return p?p.amount:Math.min(x.installment,x.total)});
  var fund=S.fund||0,floorM=(S.floor||0)*N,goal=S.goal||0;
  var base=salary-fixedTot-debtTot-fund;
  var left=base-floorM;
  var effSave=Math.max(0,Math.min(goal,left));
  var effFun=Math.max(0,Math.min(S.funCap||0,left-effSave));
  var funBudget=effFun+(S.funBonus[mk]||0);
  var poolTotal=salary-fixedTot-debtTot-fund-effSave-effFun;
  var ms=S.expenses.filter(function(e){return e.date.indexOf(mk)===0});
  var sd=(S.startDate&&S.startDate.indexOf(mk)===0)?(parseInt(S.startDate.slice(8),10)||1):1;
  ms.forEach(function(e){var dn=parseInt(e.date.slice(8),10);if(dn&&dn<sd)sd=dn});
  var span=N-sd+1;
  var poolEff=poolTotal>0?poolTotal*span/N:poolTotal;
  var depMonth=S.deposits.filter(function(x){return x.date.indexOf(mk)===0});
  var depAll=sum(depMonth,function(x){return x.amount});
  var depSal=sum(depMonth.filter(function(x){return x.src!=='extra'}),function(x){return x.amount});
  var depExtra=Math.max(0,depSal-effSave);
  var all=poolSpentOf(ms,funBudget,fund);
  var bef=poolSpentOf(ms.filter(function(e){return e.date<td}),funBudget,fund);
  var totalNow=all.total+depExtra,before=bef.total+depExtra;
  var todaySpent=Math.max(0,all.total-bef.total);
  var dailyBudget=(poolEff-before)/D;
  var leftToday=dailyBudget-todaySpent;
  var remaining=poolEff-totalNow;
  var dailyNext=D>1?remaining/(D-1):remaining;
  var sodMonth=sum(ms.filter(function(e){return e.pay==='sodexo'}),function(e){return e.amount});
  var sodBal=(S.sodexo.start||0)+sodRest();
  var sodAvg=sodMonth/d;
  var sodDays=sodAvg>0?Math.max(0,sodBal)/sodAvg:null;
  var freed=Math.max(0,sodMonth-sum(depMonth.filter(function(x){return x.src==='liberado'}),function(x){return x.amount}));
  return {now:now,y:y,m:m,d:d,N:N,D:D,mk:mk,td:td,salary:salary,fixedTot:fixedTot,debtTot:debtTot,fund:fund,floorM:floorM,goal:goal,base:base,left:left,effSave:effSave,effFun:effFun,funBudget:funBudget,poolTotal:poolTotal,poolEff:poolEff,sd:sd,span:span,ms:ms,depAll:depAll,totalNow:totalNow,todaySpent:todaySpent,dailyBudget:dailyBudget,leftToday:leftToday,remaining:remaining,dailyNext:dailyNext,fundS:all.fundS,funS:all.funS,dailySp:all.daily,sodMonth:sodMonth,sodBal:sodBal,sodDays:sodDays,freed:freed};
}
function buildDue(now){
  now=now||new Date();
  var y=now.getFullYear(),m=now.getMonth(),T0=new Date(y,m,now.getDate()),mk=mkey(now);
  var dd=function(yy,mm,day){return new Date(yy,mm,Math.min(day,daysIn(yy,mm)))};
  var rec=function(kind,id){return S.payments.filter(function(p){return p.kind===kind&&p.ref===id&&p.month===mk})[0]};
  var out=[];
  S.fixed.forEach(function(f){
    var p=rec('fixed',f.id),thisD=dd(y,m,f.day),asm=!p&&!!f.created&&thisD<parseYmd(f.created),nextD=(p||asm)?dd(y,m+1,f.day):thisD;
    out.push({kind:'fixed',id:f.id,name:f.name,amount:p?p.amount:f.amount,day:f.day,paid:!!p,assumed:asm,payRec:p,thisDate:thisD,next:nextD,diff:dayDiff(T0,nextD)});
  });
  S.debts.forEach(function(x){
    var p=rec('debt',x.id);
    if(x.total<=0&&!p)return;
    var thisD=dd(y,m,x.day),asm=!p&&!!x.created&&thisD<parseYmd(x.created),nextD=p?(x.total>0?dd(y,m+1,x.day):null):(asm?dd(y,m+1,x.day):thisD);
    out.push({kind:'debt',id:x.id,name:x.creditor,amount:p?p.amount:Math.min(x.installment,x.total),day:x.day,paid:!!p,assumed:asm,payRec:p,thisDate:thisD,next:nextD,diff:nextD?dayDiff(T0,nextD):null});
  });
  out.forEach(function(i){i.late=!i.paid&&!i.assumed&&i.diff!==null&&i.diff<0});
  return out;
}
var when=function(i){if(i.diff===null)return '';if(i.diff<0)return 'atrasado '+(-i.diff)+' d';if(i.diff===0)return 'hoy';if(i.diff===1)return 'mañana';return 'en '+i.diff+' días'};
function scenarios(c){
  var N=c.N,sod=S.sodexo.monthly||0,comm=S.comm.typical||0,sp=S.comm.split;
  var pS=sp.save/100,pD=sp.debt/100,pF=Math.max(0,1-pS-pD);
  var a={save:c.effSave,day:c.poolTotal/N};
  var need=Math.max(0,(S.goal||0)-c.effSave),toSave=Math.min(need,sod);
  var b={save:c.effSave+toSave,day:(c.poolTotal+sod-toSave)/N};
  var cc={save:b.save+comm*pS,day:b.day,debt:comm*pD,fun:comm*pF};
  return {a:a,b:b,c:cc};
}
function suggestFun(goal,fund,floor){
  var c=calc(),left=(S.salary.amount||0)-c.fixedTot-c.debtTot-fund-floor*c.N-goal;
  return Math.max(0,Math.round(left*0.3));
}
function judge(inp,c){
  var food=inp.food||0,other=inp.other||0,total=food+other;
  if(!S.salary.amount)return {err:'Primero carga tu sueldo en Ajustes.'};
  if(total<=0)return {err:'Escribe un monto para evaluar.'};
  var sodBal=Math.max(0,c.sodBal),sodPart=Math.min(food,sodBal),M=food-sodPart+other;
  var useFun=inp.type!=='comida';
  var F=Math.max(0,c.funBudget-c.funS),fromFun=useFun?Math.min(M,F):0,fromPool=M-fromFun;
  var R=c.remaining,E=S.floor||0,Dl=c.D;
  var dailyNow=Math.max(0,R/Dl),newDaily=(R-fromPool)/Dl;
  var v='ok',reason='';
  if(fromPool<=0){
    v='ok';
    reason=M<=0?'Lo cubre tu Sodexo. No toca tu sueldo.':'Cabe en tu tope de gustos y salidas (te quedarían '+money(F-fromFun)+').';
  }else if(R-fromPool<0||newDaily<E){
    v='bad';
    reason=R-fromPool<0?'No alcanza: te faltarían '+money(fromPool-R)+' para cerrar el mes.':'Te dejaría menos de '+money(E)+' al día para lo esencial.';
    var cm=S.comm.typical||0;
    if(cm>0&&R-fromPool+cm>=0&&(R-fromPool+cm)/Dl>=E)reason+=' Solo alcanzaría contando comisiones que aún no cobras.';
  }else if(newDaily<dailyNow*0.8){
    v='warn';
    reason='Puedes, pero tu gasto diario baja de '+money(dailyNow)+' a '+money(newDaily)+' hasta fin de mes.';
  }else{
    v='ok';
    reason='Casi no cambia tu presupuesto diario ('+money(dailyNow)+' a '+money(newDaily)+').';
  }
  var lines=[];
  if(sodPart>0)lines.push('Sodexo cubre '+money(sodPart));
  if(M>0)lines.push('De tu bolsillo: '+money(M));
  if(fromFun>0)lines.push(money(fromFun)+' salen de tu tope de gustos');
  if(fromPool>0)lines.push(money(fromPool)+' salen de tu presupuesto diario');
  if(food>0&&sodPart<food&&(S.sodexo.monthly||0)>0&&sodBal<food)lines.push('Tu saldo Sodexo ('+money(sodBal)+') no alcanza para toda la comida');
  return {v:v,title:{ok:'Puedes',warn:'Con cuidado',bad:'No conviene'}[v],reason:reason,lines:lines,total:total};
}
function buildAlerts(c,due){
  var a=[];
  if(!S.salary.amount)return a;
  if(c.left<0)a.push({l:'bad',t:'Tu sueldo no alcanza para lo fijo, tus deudas y lo esencial: faltan '+money(-c.left)+' al mes. Revisa cuotas y servicios.'});
  else if(c.effSave<S.goal)a.push({l:'info',t:'Tu meta de ahorro bajó a '+money(c.effSave)+' este mes para que no te falte dinero.'});
  var late=due.filter(function(i){return i.late});
  if(late.length)a.push({l:'bad',t:late.length===1?'Pago atrasado: '+late[0].name+' ('+money(late[0].amount)+').':late.length+' pagos atrasados. Revisa el calendario.'});
  due.filter(function(i){return !i.late&&i.diff!==null&&i.diff<=3&&!i.paid}).sort(function(x,y){return x.diff-y.diff}).slice(0,2).forEach(function(i){
    a.push({l:'warn',t:'Vence '+i.name+' '+when(i)+' ('+money(i.amount)+').'});
  });
  if(c.poolTotal>=0&&c.leftToday<0)a.push({l:'bad',t:'Hoy te pasaste '+money(-c.leftToday)+'. Mañana tendrás '+money(Math.max(0,c.dailyNext))+'.'});
  var el=c.d-c.sd+1;
  if(c.poolEff>0&&el>=5&&c.totalNow/c.poolEff>el/c.span+0.12)a.push({l:'warn',t:'Estás gastando más rápido de lo planeado: llevas '+Math.round(c.totalNow/c.poolEff*100)+'% del presupuesto en '+Math.round(el/c.span*100)+'% del periodo.'});
  if(c.funBudget>0&&c.funS/c.funBudget>=0.8)a.push({l:'warn',t:'Ya usaste '+Math.round(c.funS/c.funBudget*100)+'% de tu tope de gustos y salidas.'});
  if(c.fund>0&&c.fundS/c.fund>=0.8)a.push({l:'warn',t:'Tu fondo de imprevistos va en '+Math.round(c.fundS/c.fund*100)+'%.'});
  if(c.sodDays!==null&&c.sodBal>0&&c.sodDays<=4)a.push({l:'warn',t:'Tu Sodexo te alcanza unos '+Math.max(1,Math.round(c.sodDays))+' días al ritmo actual.'});
  if(c.salary>0&&c.debtTot/c.salary>0.4)a.push({l:'info',t:'Tus cuotas de deuda son '+Math.round(c.debtTot/c.salary*100)+'% de tu sueldo. Vale la pena priorizar la deuda más cara.'});
  var order={bad:0,warn:1,info:2};
  return a.sort(function(x,y){return order[x.l]-order[y.l]});
}

  hoy:'Este número es lo que puedes gastar hoy sin tocar tus pagos ni tu ahorro. Se recalcula cada día con lo que registras.',
  reg:'Anota cada gasto apenas lo hagas: monto, categoría y medio de pago. Sodexo solo se permite en comida.',

};
function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme==='dark'?'dark':'light')}
function render(keep){
  var y=window.scrollY;
  C=calc();DUE=buildDue();
  var R={hoy:vHoy,reg:vReg,cal:vCal,deu:vDeu,res:vRes,aju:vAju,guia:vGuia};
  $('#screen').innerHTML=R[route]();
  document.body.classList.toggle('guide',route==='guia');
  $('#nav').innerHTML=Object.keys(TITLES).map(function(k){return '<button class="'+(route===k?'on':'')+'" data-act="go" data-v="'+k+'" aria-label="'+TITLES[k][0]+'">'+ico(k,24)+'<span>'+TITLES[k][0]+'</span></button>'}).join('');
  $('#fab').style.display=(route==='hoy'&&S.salary.amount>0)?'block':'none';
  $('#helpBtn').innerHTML=ico('q',22);$('#gearBtn').innerHTML=ico('gear',22);
  window.scrollTo(0,keep?y:0);
}

/* ================= acciones ================= */
var A={};
A.go=function(el){route=el.dataset.v;render()};
A.help=function(){openSheet('<h2>Ayuda</h2><p style="margin:8px 0 14px">'+esc(HELP[route]||HELP.hoy)+'</p><button class="btn pri wide" data-act="closeSheet">Entendido</button>')};
A.closeSheet=closeSheet;
A.quick=function(){route='reg';D.tab='gasto';render()};
A.gotoTab=function(el){route='reg';D.tab=el.dataset.v;render()};
A.askBig=function(){route='reg';D.tab='puedo';render()};
A.tab=function(el){D.tab=el.dataset.v;render(true)};
A.startGuide=function(){closeSheet();G.step=1;route='guia';render()};
A.pickCat=function(el){D.cat=el.dataset.v;render(true)};
A.pickPay=function(el){D.pay=el.dataset.v;render(true)};
A.showDate=function(){D.showDate=true;render(true)};
A.saveExp=function(){
  var amt=num($('#amt').value);
  if(amt<=0){toast('Escribe el monto');return}
  if(!D.cat){toast('Elige una categoría');return}
  var pay=curPay(),out=S.outings.filter(function(o){return o.active})[0],dt=D.showDate&&$('#dt')?$('#dt').value:ymd(new Date());
  S.expenses.push({id:uid(),date:dt||ymd(new Date()),amount:amt,cat:D.cat,pay:pay,note:(D.note||'').trim(),outing:out?out.id:null});
  S.lastPay=pay;persist();
  var name=catOf(D.cat).n;
  D.cat=null;D.amount='';D.note='';D.date='';D.showDate=false;
  C=calc();
  toast('Guardado: '+money(amt)+' en '+name+'. Hoy te quedan '+money(Math.max(0,C.leftToday)));
  render(true);

  var t=ev.target,k=t.dataset&&t.dataset.k;

  if(k==='salary.amount'&&v>0&&!S.startDate)S.startDate=ymd(new Date());
  if(k==='sodBal')setSodBal(v);
  else if(/^comm\.split\./.test(k))setPath(S,k,Math.min(100,Math.max(0,v)));
  else setPath(S,k,(k==='salary.day'||k==='sodexo.day')?Math.min(31,Math.max(1,Math.round(v)||1)):v);
  persist();toast('Guardado');
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeSheet()});
applyTheme();
render();
})();
</script>
